<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>外婆港湾居家养护助手</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "微软雅黑",system-ui,sans-serif;
}
body{
    background: linear-gradient(135deg, #f7f2fc 0%, #efe6f8 100%);
    min-height: 100vh;
    padding-top: 100px;
    text-align: center;
}
.logo{
    width: 70px;
    height: 76px;
    margin: 0 auto 24px;
}
.title{
    font-size: 34px;
    color:#3b2e4c;
    margin-bottom:12px;
    font-weight: 600;
}
.tag{
    display: inline-block;
    padding: 8px 16px;
    background: #ede4f7;
    color: #8855bb;
    border-radius: 20px;
    font-size: 14px;
    margin-bottom: 24px;
}
.desc{
    font-size:20px;
    margin-bottom: 60px;
    line-height: 1.8;
    font-weight: 600;
}
.gradient-text{
    background: linear-gradient(135deg, #9966cc 0%, #824fb8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.slogan-sub{
    font-size: 16px;
    font-weight: 400;
    display: block;
    margin-top: 4px;
}
.open-btn{
    font-size:20px;
    padding:16px 42px;
    background:#9966cc;
    color:#fff;
    border:none;
    border-radius:12px;
    cursor:pointer;
    box-shadow: 0 4px 12px rgba(153, 102, 204, 0.3);
    transition: all 0.25s ease;
}
.open-btn:hover{
    background:#824fb8;
    box-shadow: 0 6px 16px rgba(153, 102, 204, 0.45);
}

/* ===== 聊天容器 ===== */
#chatContainer {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 99998;
    background: #fff;
    text-align: left;
    justify-content: center;
}
#chatContainer.chat-open {
    display: flex;
}
#chatContainer > div {
    width: 100%;
    max-width: 700px;
    height: 100%;
}
/* 强制聊天区文字左对齐 */
#chatContainer,
#chatContainer div,
#chatContainer p,
#chatContainer span,
#chatContainer li,
#chatContainer td,
#chatContainer th {
    text-align: left !important;
}

.close-btn {
    display: none;
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(153,102,204,0.9);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    z-index: 1000000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.close-btn:hover { background: #824fb8; }

/* 只隐藏 video/audio 元素本身 */
#chatContainer video,
#chatContainer audio {
    display: none !important;
}

.loading-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.9);
    z-index: 99999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
.loading-overlay .spinner {
    width: 40px; height: 40px;
    border: 4px solid #ede4f7;
    border-top-color: #9966cc;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay .text {
    font-size: 18px;
    color: #9966cc;
}
</style>
</head>
<body>

<button class="close-btn" id="closeBtn">← 返回首页</button>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="text">正在加载聊天界面...</div>
</div>

<div id="chatContainer"></div>

<div id="homePage">
<div class="logo">
<svg viewBox="0 0 100 110" width="70" height="76">
  <path d="M50 6 L92 20 L92 52 C92 80 50 104 50 104 C50 104 8 80 8 52 L8 20 Z" fill="url(#purpleGrad)"/>
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9966cc"/>
      <stop offset="100%" stop-color="#824fb8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdd70"/>
      <stop offset="100%" stop-color="#e6b840"/>
    </linearGradient>
  </defs>
  <path d="M50,38 C42,30 30,34 30,48 C30,62 50,74 50,74 C50,74 70,62 70,48 C70,34 58,30 50,38 Z" fill="url(#goldGrad)"/>
</svg>
</div>
<h1 class="title">外婆港湾居家养护助手</h1>
<div class="tag">亲情陪护 · 康复咨询 · 日常关怀</div>
<p class="desc">
    <span class="gradient-text">以爱为名，以AI为翼</span>
    <span class="gradient-text slogan-sub">五年级小学生为外婆打造的康复礼物</span>
</p>
<button class="open-btn" id="btn">点击开启康复AI助手</button>
</div>

<script>
var cozeWebSDK = null;
var welcomeInjected = false;
var monitorObserver = null;
var initializing = false;

// ===== 清缓存（仅清聊天相关） =====
function clearChatCache() {
    try {
        var keys = Object.keys(localStorage);
        keys.forEach(function(key) {
            var kl = key.toLowerCase();
            if (kl.indexOf('coze') > -1 || kl.indexOf('chat') > -1 ||
                kl.indexOf('sdk') > -1 || kl.indexOf('conversation') > -1 ||
                kl.indexOf('message') > -1 || kl.indexOf('bot') > -1) {
                localStorage.removeItem(key);
            }
        });
        try { sessionStorage.clear(); } catch(e) {}
    } catch(e) {}
}

// ===== 查找 SDK 内部消息滚动容器 =====
function findMessageArea() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return null;

    // 策略1：按类名关键词找
    var patterns = ['message-list', 'msg-list', 'chat-content', 'message-container',
                    'msg-container', 'chat-body', 'messages-wrapper', 'conversation-body',
                    'chat-messages', 'msg-body'];
    for (var i = 0; i < patterns.length; i++) {
        var els = chat.querySelectorAll('[class*="' + patterns[i] + '"]');
        for (var j = 0; j < els.length; j++) {
            if (els[j].offsetHeight > 100 && els[j].offsetWidth > 100) {
                return els[j];
            }
        }
    }

    // 策略2：找可滚动的大容器
    var divs = chat.querySelectorAll('div');
    for (var k = 0; k < divs.length; k++) {
        var d = divs[k];
        if (d.offsetHeight > 200 && d.offsetWidth > 200) {
            var oy = getComputedStyle(d).overflowY;
            if (oy === 'auto' || oy === 'scroll') {
                return d;
            }
        }
    }

    // 策略3：找子元素最多的中等大小容器
    var best = null;
    var maxKids = 3;
    for (var m = 0; m < divs.length; m++) {
        var dd = divs[m];
        if (dd.offsetHeight > 200 && dd.children.length > maxKids) {
            maxKids = dd.children.length;
            best = dd;
        }
    }
    return best;
}

// ===== 检查 SDK 是否已显示真实消息 =====
function hasRealBotMessage(container) {
    if (!container) return false;
    // 查找有实质文字内容的消息气泡
    var candidates = container.querySelectorAll(
        '[class*="bubble"], [class*="message-content"], [class*="msg-content"], [class*="text"]'
    );
    for (var i = 0; i < candidates.length; i++) {
        var t = candidates[i].textContent.trim();
        if (t.length > 5 && t.indexOf('正在') === -1 && t.indexOf('加载') === -1) {
            return true;
        }
    }
    // 兜底：如果容器内有超过2个子元素（头像+气泡等），认为有消息
    if (container.children && container.children.length > 2) {
        var allText = container.textContent.trim();
        if (allText.length > 20) return true;
    }
    return false;
}

// ===== 注入欢迎消息到 SDK 消息区内部 =====
function injectWelcomeMessage() {
    if (welcomeInjected) return;

    var msgArea = findMessageArea();
    if (!msgArea) return; // SDK 还没渲染好，下次再试

    // 如果 SDK 已经有真实消息了，不注入
    if (hasRealBotMessage(msgArea)) {
        welcomeInjected = true; // 标记完成，不再尝试
        return;
    }

    // 如果已经注入过（DOM 还在），不重复
    if (msgArea.querySelector('#welcomeMsg')) {
        welcomeInjected = true;
        return;
    }

    welcomeInjected = true;

    var welcomeDiv = document.createElement('div');
    welcomeDiv.id = 'welcomeMsg';
    welcomeDiv.style.cssText = 'display:flex;align-items:flex-start;gap:8px;padding:16px;animation:welcomeFade 0.3s ease;';
    welcomeDiv.innerHTML =
        '<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#9966cc,#824fb8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0;">🏠</div>' +
        '<div style="background:#f4f0f9;border-radius:12px;padding:12px 16px;max-width:80%;line-height:1.6;color:#333;font-size:15px;">您好！我是外婆港湾居家养护助手，很高兴为您服务。请问我该怎么称呼您比较合适呢？叫爷爷还是奶奶呀？</div>';

    msgArea.insertBefore(welcomeDiv, msgArea.firstChild);

    // 添加动画样式（只加一次）
    if (!document.getElementById('welcomeAnimStyle')) {
        var st = document.createElement('style');
        st.id = 'welcomeAnimStyle';
        st.textContent = '@keyframes welcomeFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}';
        document.head.appendChild(st);
    }
}

// ===== 只对"好的/谢谢"等短回复去除免责，康复建议保留免责 =====
function cleanShortAckDisclaimer() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return;

    var walker = document.createTreeWalker(chat, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node) {
            if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
            var p = node.parentElement;
            if (!p) return NodeFilter.FILTER_REJECT;
            var tag = p.tagName;
            if (tag === 'SCRIPT' || tag === 'STYLE') return NodeFilter.FILTER_REJECT;
            if (p.closest && p.closest('#welcomeMsg')) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
        }
    }, false);

    var nodes = [];
    var n;
    while (n = walker.nextNode()) { nodes.push(n); }

    nodes.forEach(function(node) {
        var val = node.nodeValue;
        if (val.indexOf('居家养护参考') === -1 &&
            val.indexOf('康复方案仅供参考') === -1 &&
            val.indexOf('不能替代医生') === -1 &&
            val.indexOf('遵线下骨科') === -1 &&
            val.indexOf('遵医嘱') === -1) {
            return;
        }

        // 向上找最近的"消息行"祖先
        var msgEl = node.parentElement;
        var depth = 0;
        while (msgEl && depth < 12) {
            if (msgEl.parentElement === chat ||
                (msgEl.parentElement && msgEl.parentElement.getAttribute &&
                 msgEl.parentElement.getAttribute('id') === 'chatContainer')) {
                break;
            }
            // 检查是否是消息行：包含头像或有较大宽度
            if (msgEl.offsetWidth > 200 && msgEl.children.length >= 1) {
                var pt = msgEl.textContent.trim();
                // 只对短回复（<100字）且包含确认用语的去除免责
                if (pt.length < 100 &&
                    /好的|谢谢|嗯嗯|知道了|不客气|收到|明白|感谢|好嘞|好呀/.test(pt)) {
                    var v = val;
                    v = v.replace(/[，,。.\s]*所有内容仅作居家养护参考[^。！？\n]{0,120}[。.]?/g, '');
                    v = v.replace(/[，,。.\s]*所有锻炼需缓慢发力[，,]身体不适立刻停止[，,]康复方案仅供参考[，,]遵从线下骨科医生指导[。.]?/g, '');
                    v = v.replace(/[，,。.\s]*康复方案仅供参考[，,]遵从线下骨科医生指导[。.]?/g, '');
                    v = v.replace(/[，,。.\s]*不能替代医生[^\n。！？]{0,60}[。.]?/g, '');
                    v = v.replace(/[，,。.\s]*温馨提示[：:][^。！？\n]{0,80}[。.]?/g, '');
                    v = v.replace(/[，,。.\s]+$/g, '');
                    if (v !== val) {
                        node.nodeValue = v;
                    }
                    return;
                }
                break;
            }
            msgEl = msgEl.parentElement;
            depth++;
        }
    });
}

// ===== 启动轻量监控 =====
function startMonitor() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return;

    if (monitorObserver) {
        try { monitorObserver.disconnect(); } catch(e) {}
    }
    var timer;
    monitorObserver = new MutationObserver(function() {
        clearTimeout(timer);
        timer = setTimeout(function() {
            cleanShortAckDisclaimer();
        }, 600);
    });
    monitorObserver.observe(chat, { childList: true, subtree: true, characterData: true });
}

// ===== 多次尝试注入欢迎语 =====
function scheduleWelcomeInjection() {
    var delays = [300, 800, 1500, 2500, 4000];
    delays.forEach(function(d) {
        setTimeout(function() {
            if (!welcomeInjected) {
                injectWelcomeMessage();
            }
        }, d);
    });
}

// ===== 打开聊天 =====
function openChat() {
    if (initializing) return;
    initializing = true;

    document.getElementById('homePage').style.display = 'none';
    document.getElementById('closeBtn').style.display = 'block';
    document.getElementById('loadingOverlay').style.display = 'flex';
    document.getElementById('chatContainer').classList.add('chat-open');

    welcomeInjected = false;
    clearChatCache();
    document.getElementById('chatContainer').innerHTML = '';

    var userId = 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

    if (typeof CozeWebSDK === 'undefined') {
        var s = document.createElement('script');
        s.src = 'https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.20/libs/cn/index.js';
        s.onload = function() { initChat(userId); };
        s.onerror = function() {
            initializing = false;
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('加载失败，请检查网络后刷新');
        };
        document.head.appendChild(s);
    } else {
        initChat(userId);
    }
}

// ===== 初始化聊天 =====
function initChat(userId) {
    try {
        if (cozeWebSDK) {
            try { cozeWebSDK.destroy(); } catch(e) {}
            cozeWebSDK = null;
        }
        clearChatCache();

        cozeWebSDK = new CozeWebSDK.WebChatClient({
            config: {
                bot_id: '7673548882957516835',
                isIframe: false
            },
            auth: {
                type: 'token',
                token: 'pat_ijcyjbaT6lOVV92tApQrNccNVgzVnRdpg1g2bl4RHlAAZnFbNkbwrjEg88qtl5JV',
                onRefreshToken: function() {
                    return 'pat_ijcyjbaT6lOVV92tApQrNccNVgzVnRdpg1g2bl4RHlAAZnFbNkbwrjEg88qtl5JV';
                }
            },
            userInfo: {
                id: userId,
                url: 'https://lf-coze-web-cdn.coze.cn/obj/coze-web-cn/obric/coze/favicon.1970.png',
                nickname: '用户'
            },
            ui: {
                base: {
                    layout: window.innerWidth >= 768 ? 'pc' : 'mobile',
                    lang: 'zh-CN',
                    zIndex: 99998
                },
                asstBtn: { isNeed: false },
                header: { isShow: true, isNeedClose: false },
                chatBot: {
                    title: '外婆港湾居家养护助手',
                    el: document.getElementById('chatContainer'),
                    isNeedAudio: true,
                    isNeedFunctionCallMessage: true,
                    onShow: function() {
                        document.getElementById('loadingOverlay').style.display = 'none';
                        initializing = false;
                        startMonitor();
                        scheduleWelcomeInjection();
                    },
                    onHide: function() {
                        closeChat();
                    }
                },
                footer: { isShow: false }
            }
        });

        cozeWebSDK.showChatBot();

        // 兜底
        setTimeout(function() {
            document.getElementById('loadingOverlay').style.display = 'none';
            initializing = false;
            if (!welcomeInjected) injectWelcomeMessage();
        }, 5000);

    } catch(e) {
        initializing = false;
        document.getElementById('loadingOverlay').style.display = 'none';
        alert('初始化失败: ' + e.message);
    }
}

// ===== 关闭聊天 =====
function closeChat() {
    if (monitorObserver) {
        try { monitorObserver.disconnect(); } catch(e) {}
        monitorObserver = null;
    }
    if (cozeWebSDK) {
        try { cozeWebSDK.destroy(); } catch(e) {}
        cozeWebSDK = null;
    }
    welcomeInjected = false;
    initializing = false;
    document.getElementById('chatContainer').classList.remove('chat-open');
    document.getElementById('chatContainer').innerHTML = '';
    document.getElementById('closeBtn').style.display = 'none';
    document.getElementById('homePage').style.display = '';
    clearChatCache();
}

document.getElementById('btn').addEventListener('click', openChat);
document.getElementById('closeBtn').addEventListener('click', closeChat);

clearChatCache();
</script>
</body>
</html>
