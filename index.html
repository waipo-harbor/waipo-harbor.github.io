<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>外婆港湾居家养护助手</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "微软雅黑",system-ui,sans-serif;
}
body{
    background: linear-gradient(135deg, #f7f2fc 0%, #efe6f8 100%);
    min-height: 100vh;
    padding-top: 100px;
    text-align: center;
}
.logo{
    width: 70px;
    height: 76px;
    margin: 0 auto 24px;
}
.title{
    font-size: 34px;
    color:#3b2e4c;
    margin-bottom:12px;
    font-weight: 600;
}
.tag{
    display: inline-block;
    padding: 8px 16px;
    background: #ede4f7;
    color: #8855bb;
    border-radius: 20px;
    font-size: 14px;
    margin-bottom: 24px;
}
.desc{
    font-size:20px;
    margin-bottom: 60px;
    line-height: 1.8;
    font-weight: 600;
}
.gradient-text{
    background: linear-gradient(135deg, #9966cc 0%, #824fb8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.slogan-sub{
    font-size: 16px;
    font-weight: 400;
    display: block;
    margin-top: 4px;
}
.open-btn{
    font-size:20px;
    padding:16px 42px;
    background:#9966cc;
    color:#fff;
    border:none;
    border-radius:12px;
    cursor:pointer;
    box-shadow: 0 4px 12px rgba(153, 102, 204, 0.3);
    transition: all 0.25s ease;
}
.open-btn:hover{
    background:#824fb8;
    box-shadow: 0 6px 16px rgba(153, 102, 204, 0.45);
}

/* ===== 聊天容器 ===== */
#chatContainer {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 99998;
    background: #fff;
    text-align: left;
    justify-content: center;
}
#chatContainer.chat-open {
    display: flex;
}
#chatContainer > div {
    width: 100%;
    max-width: 700px;
    height: 100%;
}
/* 强制聊天区内所有文字左对齐 */
#chatContainer,
#chatContainer div,
#chatContainer p,
#chatContainer span,
#chatContainer li,
#chatContainer td,
#chatContainer th,
#chatContainer label {
    text-align: left !important;
}

.close-btn {
    display: none;
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(153,102,204,0.9);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    z-index: 1000000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.close-btn:hover { background: #824fb8; }

/* 只隐藏原生 video/audio 元素，不隐藏卡片容器 */
#chatContainer video,
#chatContainer audio {
    display: none !important;
}

/* 欢迎消息气泡 */
.welcome-msg {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 16px;
    animation: fadeIn 0.3s ease;
}
.welcome-msg .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #9966cc, #824fb8);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    flex-shrink: 0;
}
.welcome-msg .bubble {
    background: #f4f0f9;
    border-radius: 12px;
    padding: 12px 16px;
    max-width: 80%;
    line-height: 1.6;
    color: #333;
    font-size: 15px;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.loading-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.9);
    z-index: 99999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
.loading-overlay .spinner {
    width: 40px; height: 40px;
    border: 4px solid #ede4f7;
    border-top-color: #9966cc;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay .text {
    font-size: 18px;
    color: #9966cc;
}
</style>
</head>
<body>

<button class="close-btn" id="closeBtn">← 返回首页</button>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="text">正在加载聊天界面...</div>
</div>

<div id="chatContainer"></div>

<div id="homePage">
<div class="logo">
<svg viewBox="0 0 100 110" width="70" height="76">
  <path d="M50 6 L92 20 L92 52 C92 80 50 104 50 104 C50 104 8 80 8 52 L8 20 Z" fill="url(#purpleGrad)"/>
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9966cc"/>
      <stop offset="100%" stop-color="#824fb8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdd70"/>
      <stop offset="100%" stop-color="#e6b840"/>
    </linearGradient>
  </defs>
  <path d="M50,38 C42,30 30,34 30,48 C30,62 50,74 50,74 C50,74 70,62 70,48 C70,34 58,30 50,38 Z" fill="url(#goldGrad)"/>
</svg>
</div>
<h1 class="title">外婆港湾居家养护助手</h1>
<div class="tag">亲情陪护 · 康复咨询 · 日常关怀</div>
<p class="desc">
    <span class="gradient-text">以爱为名，以AI为翼</span>
    <span class="gradient-text slogan-sub">五年级小学生为外婆打造的康复礼物</span>
</p>
<button class="open-btn" id="btn">点击开启康复AI助手</button>
</div>

<script>
var cozeWebSDK = null;
var welcomeInjected = false;
var disclaimerObserver = null;

// ===== 彻底清缓存 =====
function clearAllCache() {
    try {
        var keys = Object.keys(localStorage);
        keys.forEach(function(key) {
            localStorage.removeItem(key);
        });
        try { sessionStorage.clear(); } catch(e) {}
        document.cookie.split(";").forEach(function(c) {
            var eqPos = c.indexOf("=");
            var name = eqPos > -1 ? c.substr(0, eqPos).trim() : c.trim();
            document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
        });
        if (window.indexedDB && indexedDB.databases) {
            indexedDB.databases().then(function(dbs) {
                dbs.forEach(function(db) {
                    if (db.name) indexedDB.deleteDatabase(db.name);
                });
            }).catch(function(){});
        }
        if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                registrations.forEach(function(r) { r.unregister(); });
            }).catch(function(){});
        }
    } catch(e) {}
}

// ===== 注入欢迎消息（不检测已有消息，直接注入） =====
function injectWelcomeMessage() {
    if (welcomeInjected) return;

    var chat = document.getElementById('chatContainer');
    if (!chat) return;

    welcomeInjected = true;

    var welcomeDiv = document.createElement('div');
    welcomeDiv.id = 'welcomeMsg';
    welcomeDiv.className = 'welcome-msg';
    welcomeDiv.innerHTML =
        '<div class="avatar">🏠</div>' +
        '<div class="bubble">您好！我是外婆港湾居家养护助手，很高兴为您服务。请问我该怎么称呼您比较合适呢？叫爷爷还是奶奶呀？</div>';

    // 插入到 chatContainer 最前面
    chat.insertBefore(welcomeDiv, chat.firstChild);
}

// ===== 精确去除免责声明（不跨句子匹配） =====
function removeDisclaimer() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return;

    var walker = document.createTreeWalker(chat, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node) {
            // 跳过我们注入的欢迎消息
            if (node.parentElement && node.parentElement.closest && node.parentElement.closest('.welcome-msg')) {
                return NodeFilter.FILTER_REJECT;
            }
            // 跳过 script/style
            var tag = node.parentElement ? node.parentElement.tagName : '';
            if (tag === 'SCRIPT' || tag === 'STYLE') return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
        }
    }, false);

    var nodes = [];
    var node;
    while (node = walker.nextNode()) {
        if (node.nodeValue && node.nodeValue.trim().length > 0) {
            nodes.push(node);
        }
    }

    nodes.forEach(function(n) {
        var original = n.nodeValue;
        var v = original;

        // 1. 完整的"温馨提示：...免责内容..."（不跨句号/换行）
        v = v.replace(/温馨提示[：:][^。！？\n]{0,200}?(?:康复方案仅供参考|遵从线下骨科医生指导|遵医嘱开展|身体不适立刻停止)[^。！？\n]{0,50}[。.]?/g, '');

        // 2. "所有内容仅作居家养护参考...遵医嘱/遵从医生指导"（不跨句号/换行）
        v = v.replace(/所有内容仅作居家养护参考[^。！？\n]{0,120}?(?:遵医嘱开展|遵从线下骨科医生指导)[^。！？\n]{0,30}[。.]?/g, '');

        // 3. 独立的免责短句
        v = v.replace(/康复方案仅供参考[，,]遵从线下骨科医生指导[。.]?/g, '');
        v = v.replace(/所有锻炼需缓慢发力[，,]身体不适立刻停止[，,]康复方案仅供参考[，,]遵从线下骨科医生指导[。.]?/g, '');
        v = v.replace(/不能替代医生[^\n。！？]{0,50}[。.]?/g, '');

        // 4. 清理残留的空"温馨提示："标题（可能带序号前缀）
        v = v.replace(/\s*\d+[.、]\s*温馨提示[：:]\s*$/g, '');
        v = v.replace(/\s*温馨提示[：:]\s*$/g, '');

        // 5. 清理末尾多余标点
        v = v.replace(/[，,。.\s]+$/g, '');

        if (v !== original) {
            n.nodeValue = v;
        }
    });
}

// ===== 隐藏视频错误占位框（保守策略：只隐藏纯SVG无文字的小容器） =====
function hideVideoErrors() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return;

    // 只处理 video 元素的错误
    var videos = chat.querySelectorAll('video');
    videos.forEach(function(vid) {
        // 隐藏 video 本身及紧邻的错误提示
        vid.style.setProperty('display', 'none', 'important');
        // 如果 video 父容器只有 video 没有文字，隐藏父容器
        var parent = vid.parentElement;
        if (parent) {
            // 检查父容器去除 video 后是否还有可见文字
            var clone = parent.cloneNode(true);
            var vidsInClone = clone.querySelectorAll('video, svg, img');
            vidsInClone.forEach(function(el) { el.remove(); });
            var remainingText = clone.textContent.trim();
            if (remainingText.length < 5 && parent.getAttribute('data-video-hidden') !== '1') {
                parent.style.setProperty('display', 'none', 'important');
                parent.setAttribute('data-video-hidden', '1');
            }
        }
    });
}

// ===== 启动监控 =====
function startMonitor() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return;

    // 只监听文本变化做免责声明替换，不做任何 DOM 隐藏
    if (disclaimerObserver) {
        try { disclaimerObserver.disconnect(); } catch(e) {}
    }
    var timer;
    disclaimerObserver = new MutationObserver(function() {
        clearTimeout(timer);
        timer = setTimeout(function() {
            removeDisclaimer();
            hideVideoErrors();
        }, 500);
    });
    disclaimerObserver.observe(chat, { childList: true, subtree: true, characterData: true });

    // 3秒后再执行一次，确保流式输出完成后清理
    setTimeout(function() {
        removeDisclaimer();
        hideVideoErrors();
    }, 3000);
}

// ===== 打开聊天 =====
function openChat() {
    document.getElementById('homePage').style.display = 'none';
    document.getElementById('closeBtn').style.display = 'block';
    document.getElementById('loadingOverlay').style.display = 'flex';
    document.getElementById('chatContainer').classList.add('chat-open');

    welcomeInjected = false;
    clearAllCache();
    document.getElementById('chatContainer').innerHTML = '';

    var userId = 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

    if (typeof CozeWebSDK === 'undefined') {
        var s = document.createElement('script');
        s.src = 'https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.20/libs/cn/index.js';
        s.onload = function() { initChat(userId); };
        s.onerror = function() {
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('加载失败，请检查网络后刷新');
        };
        document.head.appendChild(s);
    } else {
        initChat(userId);
    }
}

// ===== 初始化聊天 =====
function initChat(userId) {
    try {
        if (cozeWebSDK) {
            try { cozeWebSDK.destroy(); } catch(e) {}
            cozeWebSDK = null;
        }
        clearAllCache();

        cozeWebSDK = new CozeWebSDK.WebChatClient({
            config: {
                bot_id: '7673548882957516835',
                isIframe: false
            },
            auth: {
                type: 'token',
                token: 'pat_ijcyjbaT6lOVV92tApQrNccNVgzVnRdpg1g2bl4RHlAAZnFbNkbwrjEg88qtl5JV',
                onRefreshToken: function() {
                    return 'pat_ijcyjbaT6lOVV92tApQrNccNVgzVnRdpg1g2bl4RHlAAZnFbNkbwrjEg88qtl5JV';
                }
            },
            userInfo: {
                id: userId,
                url: 'https://lf-coze-web-cdn.coze.cn/obj/coze-web-cn/obric/coze/favicon.1970.png',
                nickname: '用户'
            },
            ui: {
                base: {
                    layout: window.innerWidth >= 768 ? 'pc' : 'mobile',
                    lang: 'zh-CN',
                    zIndex: 99998
                },
                asstBtn: { isNeed: false },
                header: { isShow: true, isNeedClose: false },
                chatBot: {
                    title: '外婆港湾居家养护助手',
                    el: document.getElementById('chatContainer'),
                    isNeedAudio: true,
                    isNeedFunctionCallMessage: true,
                    onShow: function() {
                        document.getElementById('loadingOverlay').style.display = 'none';
                        // 立即注入欢迎消息
                        injectWelcomeMessage();
                        startMonitor();
                    },
                    onHide: function() {
                        closeChat();
                    }
                },
                footer: { isShow: false }
            }
        });

        cozeWebSDK.showChatBot();

        // 兜底：确保欢迎消息注入
        setTimeout(function() { injectWelcomeMessage(); }, 500);
        setTimeout(function() { injectWelcomeMessage(); }, 1500);
        setTimeout(function() {
            injectWelcomeMessage();
            document.getElementById('loadingOverlay').style.display = 'none';
            removeDisclaimer();
            hideVideoErrors();
        }, 3000);

        // 5秒兜底隐藏加载
        setTimeout(function() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }, 5000);

    } catch(e) {
        document.getElementById('loadingOverlay').style.display = 'none';
        alert('初始化失败: ' + e.message);
    }
}

// ===== 关闭聊天 =====
function closeChat() {
    if (cozeWebSDK) {
        try { cozeWebSDK.destroy(); } catch(e) {}
        cozeWebSDK = null;
    }
    if (disclaimerObserver) {
        try { disclaimerObserver.disconnect(); } catch(e) {}
        disclaimerObserver = null;
    }
    welcomeInjected = false;
    document.getElementById('chatContainer').classList.remove('chat-open');
    document.getElementById('chatContainer').innerHTML = '';
    document.getElementById('closeBtn').style.display = 'none';
    document.getElementById('homePage').style.display = '';
    clearAllCache();
}

document.getElementById('btn').addEventListener('click', openChat);
document.getElementById('closeBtn').addEventListener('click', closeChat);

// 页面加载时清缓存
clearAllCache();
</script>
</body>
</html>
