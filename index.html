<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>外婆港湾居家养护助手</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "微软雅黑",system-ui,sans-serif;
}
body{
    background: linear-gradient(135deg, #f7f2fc 0%, #efe6f8 100%);
    min-height: 100vh;
    padding-top: 100px;
    text-align: center;
}
.logo{
    width: 70px;
    height: 76px;
    margin: 0 auto 24px;
}
.title{
    font-size: 34px;
    color:#3b2e4c;
    margin-bottom:12px;
    font-weight: 600;
}
.tag{
    display: inline-block;
    padding: 8px 16px;
    background: #ede4f7;
    color: #8855bb;
    border-radius: 20px;
    font-size: 14px;
    margin-bottom: 24px;
}
.desc{
    font-size:20px;
    margin-bottom: 60px;
    line-height: 1.8;
    font-weight: 600;
}
.gradient-text{
    background: linear-gradient(135deg, #9966cc 0%, #824fb8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.slogan-sub{
    font-size: 16px;
    font-weight: 400;
    display: block;
    margin-top: 4px;
}
.open-btn{
    font-size:20px;
    padding:16px 42px;
    background:#9966cc;
    color:#fff;
    border:none;
    border-radius:12px;
    cursor:pointer;
    box-shadow: 0 4px 12px rgba(153, 102, 204, 0.3);
    transition: all 0.25s ease;
}
.open-btn:hover{
    background:#824fb8;
    box-shadow: 0 6px 16px rgba(153, 102, 204, 0.45);
}

/* ===== 聊天容器：全屏覆盖，内容居中 ===== */
#chatContainer {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 99998;
    background: #fff;
}
#chatContainer.chat-open {
    display: flex;
    justify-content: center;
}
/* SDK 内部元素全部居中限制宽度 */
#chatContainer > div,
#chatContainer > div > div {
    max-width: 700px !important;
    width: 100% !important;
    margin: 0 auto !important;
}

.close-btn {
    display: none;
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(153,102,204,0.9);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    z-index: 1000000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.close-btn:hover { background: #824fb8; }

/* ===== 隐藏视频/音频原生元素 ===== */
#chatContainer video,
#chatContainer audio {
    display: none !important;
}

/* ===== 隐藏媒体卡片中的缩略图/封面区域（视频白框） ===== */
/* 只针对消息内容区内的卡片类元素，不碰输入框和按钮 */
#chatContainer [class*="card"] [class*="cover"],
#chatContainer [class*="card"] [class*="thumb"],
#chatContainer [class*="card"] [class*="media"],
#chatContainer [class*="Card"] [class*="Cover"],
#chatContainer [class*="Card"] [class*="Thumb"],
#chatContainer [class*="Card"] [class*="Media"],
#chatContainer [class*="rich"] [class*="cover"],
#chatContainer [class*="rich"] [class*="thumb"],
#chatContainer [class*="Rich"] [class*="Cover"],
#chatContainer [class*="Rich"] [class*="Thumb"],
#chatContainer [class*="embed"],
#chatContainer [class*="Embed"] {
    display: none !important;
}

.loading-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.9);
    z-index: 99999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
.loading-overlay .spinner {
    width: 40px; height: 40px;
    border: 4px solid #ede4f7;
    border-top-color: #9966cc;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay .text {
    font-size: 18px;
    color: #9966cc;
}
</style>
</head>
<body>

<button class="close-btn" id="closeBtn">← 返回首页</button>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="text">正在加载聊天界面...</div>
</div>

<div id="chatContainer"></div>

<!-- 首页 -->
<div id="homePage">
<div class="logo">
<svg viewBox="0 0 100 110" width="70" height="76">
  <path d="M50 6 L92 20 L92 52 C92 80 50 104 50 104 C50 104 8 80 8 52 L8 20 Z" fill="url(#purpleGrad)"/>
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9966cc"/>
      <stop offset="100%" stop-color="#824fb8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdd70"/>
      <stop offset="100%" stop-color="#e6b840"/>
    </linearGradient>
  </defs>
  <path d="M50,38 C42,30 30,34 30,48 C30,62 50,74 50,74 C50,74 70,62 70,48 C70,34 58,30 50,38 Z" fill="url(#goldGrad)"/>
</svg>
</div>
<h1 class="title">外婆港湾居家养护助手</h1>
<div class="tag">亲情陪护 · 康复咨询 · 日常关怀</div>
<p class="desc">
    <span class="gradient-text">以爱为名，以AI为翼</span>
    <span class="gradient-text slogan-sub">五年级小学生为外婆打造的康复礼物</span>
</p>
<button class="open-btn" id="btn">点击开启康复AI助手</button>
</div>

<script>
var cozeWebSDK = null;

// ===== 彻底清除所有缓存 =====
function clearAllCache() {
    try {
        // localStorage
        var keys = Object.keys(localStorage);
        keys.forEach(function(key) {
            if (key.indexOf('coze') !== -1 || key.indexOf('chat') !== -1 || key.indexOf('sdk') !== -1 || key.indexOf('7673548882957516835') !== -1) {
                localStorage.removeItem(key);
            }
        });
        // sessionStorage
        try { sessionStorage.clear(); } catch(e) {}
        // cookies
        document.cookie.split(";").forEach(function(c) {
            if (c.indexOf('coze') !== -1 || c.indexOf('chat') !== -1) {
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date(0).toUTCString() + ";path=/");
            }
        });
        // IndexedDB
        if (window.indexedDB && indexedDB.databases) {
            indexedDB.databases().then(function(dbs) {
                dbs.forEach(function(db) {
                    if (db.name && (db.name.indexOf('coze') !== -1 || db.name.indexOf('chat') !== -1 || db.name.indexOf('sdk') !== -1)) {
                        indexedDB.deleteDatabase(db.name);
                    }
                });
            }).catch(function(){});
        }
    } catch(e) {}
}

// ===== 安全地隐藏视频白框（只设置display:none，不删除元素） =====
function hideBrokenMediaCards() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return;

    // 查找所有可能是视频/媒体卡片的div
    // 特征：圆角 + 有SVG图标 + 无文字 + 有一定尺寸
    var divs = chat.querySelectorAll('div');
    for (var i = 0; i < divs.length; i++) {
        var div = divs[i];

        // 跳过已处理的
        if (div.getAttribute('data-media-hidden') === '1') continue;

        // 跳过输入框、按钮等交互区域
        if (div.closest('input, textarea, [contenteditable="true"], button, [class*="input"], [class*="footer"], [class*="compose"], [class*="send"], [class*="btn"]')) continue;

        // 必须有SVG子元素（感叹号图标）
        var svg = div.querySelector('svg');
        if (!svg) continue;

        // 文本内容必须极少（白框里没有文字）
        var text = div.textContent.trim();
        if (text.length > 3) continue;

        // 尺寸必须够大（视频框通常>150px宽, >80px高）
        if (div.offsetWidth < 120 || div.offsetHeight < 60) continue;

        // 检查是否有圆角（卡片特征）
        var style = window.getComputedStyle(div);
        var br = style.borderRadius;
        if (!br || br === '0px') continue;

        // 检查背景是否为白色或浅色
        var bg = style.backgroundColor || '';
        var isLightBg = bg.indexOf('255') > -1 || bg.indexOf('248') > -1 || bg.indexOf('245') > -1 || bg.indexOf('240') > -1 || bg === '' || bg === 'transparent';
        if (!isLightBg) continue;

        // 所有条件匹配，隐藏它
        div.style.setProperty('display', 'none', 'important');
        div.setAttribute('data-media-hidden', '1');
    }
}

// ===== 去除日常用语回复中的免责声明 =====
function stripDisclaimer() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return;

    // 需要去除的免责声明文本模式
    var patterns = [
        /所有内容仅作居家养护参考[，,。.].*?遵医嘱开展[。.]?/g,
        /所有内容仅作居家养护参考[，,。.].*?主治医生[，,].*?遵医嘱开展[。.]?/g,
        /以上内容仅供参考[，,。.].*?遵医嘱[。.]?/g,
        /温馨提示[：:].*?不能替代.*?医生[。.]?/g
    ];

    // 遍历所有文本节点
    var walker = document.createTreeWalker(chat, NodeFilter.SHOW_TEXT, null, false);
    var nodesToProcess = [];
    var node;
    while (node = walker.nextNode()) {
        var text = node.nodeValue;
        if (text && text.indexOf('居家养护参考') > -1) {
            nodesToProcess.push(node);
        }
    }

    nodesToProcess.forEach(function(textNode) {
        var original = textNode.nodeValue;
        var modified = original;
        patterns.forEach(function(pattern) {
            modified = modified.replace(pattern, '');
        });
        // 清理末尾多余的标点和空格
        modified = modified.replace(/[，,。.\s]+$/, '');
        if (modified !== original) {
            textNode.nodeValue = modified;
        }
    });
}

// ===== 启动安全的DOM监控（只隐藏不删除） =====
function startSafeObserver() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return;

    var timer = null;
    var observer = new MutationObserver(function() {
        if (timer) clearTimeout(timer);
        timer = setTimeout(function() {
            hideBrokenMediaCards();
            stripDisclaimer();
        }, 300);
    });

    observer.observe(chat, {
        childList: true,
        subtree: true,
        characterData: true
    });

    // 定期检查
    setInterval(function() {
        hideBrokenMediaCards();
        stripDisclaimer();
    }, 2000);
}

// ===== 打开聊天 =====
function openChat() {
    document.getElementById('homePage').style.display = 'none';
    document.getElementById('closeBtn').style.display = 'block';
    document.getElementById('loadingOverlay').style.display = 'flex';
    document.getElementById('chatContainer').classList.add('chat-open');

    // 彻底清缓存
    clearAllCache();

    // 清空chatContainer
    var container = document.getElementById('chatContainer');
    container.innerHTML = '';

    // 每次都用全新用户ID
    var userId = 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

    if (typeof CozeWebSDK === 'undefined') {
        var script = document.createElement('script');
        script.src = 'https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.20/libs/cn/index.js';
        script.onload = function() { initChat(userId); };
        script.onerror = function() {
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('聊天界面加载失败，请检查网络后刷新页面');
        };
        document.head.appendChild(script);
    } else {
        initChat(userId);
    }
}

// ===== 初始化聊天 =====
function initChat(userId) {
    try {
        // 销毁旧实例
        if (cozeWebSDK) {
            try { cozeWebSDK.destroy(); } catch(e) {}
            try { cozeWebSDK.close(); } catch(e) {}
            cozeWebSDK = null;
        }

        // 再清一次
        clearAllCache();

        cozeWebSDK = new CozeWebSDK.WebChatClient({
            config: {
                bot_id: '7673548882957516835',
                isIframe: false
            },
            auth: {
                type: 'token',
                token: 'pat_ijcyjbaT6lOVV92tApQrNccNVgzVnRdpg1g2bl4RHlAAZnFbNkbwrjEg88qtl5JV',
                onRefreshToken: function() {
                    return 'pat_ijcyjbaT6lOVV92tApQrNccNVgzVnRdpg1g2bl4RHlAAZnFbNkbwrjEg88qtl5JV';
                }
            },
            userInfo: {
                id: userId,
                url: 'https://lf-coze-web-cdn.coze.cn/obj/coze-web-cn/obric/coze/favicon.1970.png',
                nickname: '用户'
            },
            ui: {
                base: {
                    layout: window.innerWidth >= 768 ? 'pc' : 'mobile',
                    lang: 'zh-CN',
                    zIndex: 99998
                },
                asstBtn: { isNeed: false },
                header: { isShow: true, isNeedClose: false },
                chatBot: {
                    title: '外婆港湾居家养护助手',
                    el: document.getElementById('chatContainer'),
                    isNeedAudio: true,
                    isNeedFunctionCallMessage: false,
                    onShow: function() {
                        document.getElementById('loadingOverlay').style.display = 'none';
                        startSafeObserver();
                    },
                    onHide: function() {
                        closeChat();
                    }
                },
                footer: { isShow: false }
            }
        });

        // 显示聊天
        cozeWebSDK.showChatBot();

        // 尝试开启新会话
        setTimeout(function() {
            try {
                if (cozeWebSDK && typeof cozeWebSDK.newConversation === 'function') {
                    cozeWebSDK.newConversation();
                }
                if (cozeWebSDK && typeof cozeWebSDK.clearChatHistory === 'function') {
                    cozeWebSDK.clearChatHistory();
                }
            } catch(e) {}
        }, 1000);

        // 兜底：5秒后隐藏加载
        setTimeout(function() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }, 5000);

    } catch(e) {
        document.getElementById('loadingOverlay').style.display = 'none';
        alert('初始化失败: ' + e.message);
    }
}

// ===== 关闭聊天 =====
function closeChat() {
    if (cozeWebSDK) {
        try { cozeWebSDK.destroy(); } catch(e) {}
        cozeWebSDK = null;
    }
    document.getElementById('chatContainer').classList.remove('chat-open');
    document.getElementById('chatContainer').innerHTML = '';
    document.getElementById('closeBtn').style.display = 'none';
    document.getElementById('homePage').style.display = '';
    clearAllCache();
}

document.getElementById('btn').addEventListener('click', openChat);
document.getElementById('closeBtn').addEventListener('click', closeChat);

// 页面加载时清缓存
clearAllCache();
</script>
</body>
</html>
