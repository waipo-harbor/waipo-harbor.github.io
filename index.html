<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>外婆港湾居家养护助手</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "微软雅黑",system-ui,sans-serif;
}
body{
    background: linear-gradient(135deg, #f7f2fc 0%, #efe6f8 100%);
    min-height: 100vh;
    padding-top: 100px;
    text-align: center;
}
.logo{
    width: 70px;
    height: 76px;
    margin: 0 auto 24px;
}
.title{
    font-size: 34px;
    color:#3b2e4c;
    margin-bottom:12px;
    font-weight: 600;
}
.tag{
    display: inline-block;
    padding: 8px 16px;
    background: #ede4f7;
    color: #8855bb;
    border-radius: 20px;
    font-size: 14px;
    margin-bottom: 24px;
}
.desc{
    font-size:20px;
    margin-bottom: 60px;
    line-height: 1.8;
    font-weight: 600;
}
.gradient-text{
    background: linear-gradient(135deg, #9966cc 0%, #824fb8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.slogan-sub{
    font-size: 16px;
    font-weight: 400;
    display: block;
    margin-top: 4px;
}
.open-btn{
    font-size:20px;
    padding:16px 42px;
    background:#9966cc;
    color:#fff;
    border:none;
    border-radius:12px;
    cursor:pointer;
    box-shadow: 0 4px 12px rgba(153, 102, 204, 0.3);
    transition: all 0.25s ease;
}
.open-btn:hover{
    background:#824fb8;
    box-shadow: 0 6px 16px rgba(153, 102, 204, 0.45);
}

/* ===== 聊天容器 ===== */
#chatContainer {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 99998;
    background: #fff;
    justify-content: center;
}
#chatContainer.chat-open {
    display: flex;
}
#chatContainer > div {
    width: 100%;
    max-width: 700px;
    height: 100%;
}
/* 强制聊天区文字左对齐 */
#chatContainer,
#chatContainer div,
#chatContainer p,
#chatContainer span,
#chatContainer li,
#chatContainer td,
#chatContainer th {
    text-align: left !important;
}

.close-btn {
    display: none;
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(153,102,204,0.9);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    z-index: 1000000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.close-btn:hover { background: #824fb8; }

/* 只隐藏 video/audio 元素本身 */
#chatContainer video,
#chatContainer audio {
    display: none !important;
}

.loading-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.95);
    z-index: 99999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
.loading-overlay .spinner {
    width: 40px; height: 40px;
    border: 4px solid #ede4f7;
    border-top-color: #9966cc;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay .text {
    font-size: 18px;
    color: #9966cc;
}
</style>
</head>
<body>

<button class="close-btn" id="closeBtn">← 返回首页</button>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="text">正在加载聊天界面...</div>
</div>

<div id="chatContainer"></div>

<div id="homePage">
<div class="logo">
<svg viewBox="0 0 100 110" width="70" height="76">
  <path d="M50 6 L92 20 L92 52 C92 80 50 104 50 104 C50 104 8 80 8 52 L8 20 Z" fill="url(#purpleGrad)"/>
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9966cc"/>
      <stop offset="100%" stop-color="#824fb8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdd70"/>
      <stop offset="100%" stop-color="#e6b840"/>
    </linearGradient>
  </defs>
  <path d="M50,38 C42,30 30,34 30,48 C30,62 50,74 50,74 C50,74 70,62 70,48 C70,34 58,30 50,38 Z" fill="url(#goldGrad)"/>
</svg>
</div>
<h1 class="title">外婆港湾居家养护助手</h1>
<div class="tag">亲情陪护 · 康复咨询 · 日常关怀</div>
<p class="desc">
    <span class="gradient-text">以爱为名，以AI为翼</span>
    <span class="gradient-text slogan-sub">五年级小学生为外婆打造的康复礼物</span>
</p>
<button class="open-btn" id="btn">点击开启康复AI助手</button>
</div>

<script>
var PAT_TOKEN = 'pat_ijcyjbaT6lOVV92tApQrNccNVgzVnRdpg1g2bl4RHlAAZnFbNkbwrjEg88qtl5JV';
var BOT_ID = '7673548882957516835';
var cozeWebSDK = null;
var monitorObserver = null;
var initializing = false;

// ===== 清除本地缓存（不碰 IndexedDB，避免破坏 SDK 状态） =====
function clearChatCache() {
    try {
        var keys = Object.keys(localStorage);
        keys.forEach(function(key) {
            localStorage.removeItem(key);
        });
        try { sessionStorage.clear(); } catch(e) {}
        document.cookie.split(";").forEach(function(c) {
            var eqPos = c.indexOf("=");
            var name = eqPos > -1 ? c.substr(0, eqPos).trim() : c.trim();
            document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
        });
    } catch(e) {}
}

// ===== 通过 Coze API 创建全新会话 =====
function createNewConversation() {
    return new Promise(function(resolve) {
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://api.coze.cn/v1/conversation/create', true);
            xhr.setRequestHeader('Authorization', 'Bearer ' + PAT_TOKEN);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.timeout = 8000;
            xhr.onload = function() {
                try {
                    var resp = JSON.parse(xhr.responseText);
                    if (resp.data && resp.data.id) {
                        resolve(resp.data.id);
                    } else {
                        resolve(null);
                    }
                } catch(e) { resolve(null); }
            };
            xhr.onerror = function() { resolve(null); };
            xhr.ontimeout = function() { resolve(null); };
            xhr.send(JSON.stringify({}));
        } catch(e) {
            resolve(null);
        }
    });
}

// ===== 只对短问候/告别回复去除免责 =====
function cleanShortAckDisclaimer() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return;

    var walker = document.createTreeWalker(chat, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node) {
            if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
            var p = node.parentElement;
            if (!p) return NodeFilter.FILTER_REJECT;
            var tag = p.tagName;
            if (tag === 'SCRIPT' || tag === 'STYLE') return NodeFilter.FILTER_REJECT;
            if (node.nodeValue.indexOf('参考') === -1 &&
                node.nodeValue.indexOf('遵医嘱') === -1 &&
                node.nodeValue.indexOf('不能替代') === -1 &&
                node.nodeValue.indexOf('医生') === -1 &&
                node.nodeValue.indexOf('温馨提示') === -1) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
        }
    }, false);

    var nodes = [];
    var n;
    while (n = walker.nextNode()) { nodes.push(n); }

    var ACK_PATTERN = /好的|谢谢|感谢|嗯嗯|嗯|知道了|明白|不客气|收到|好嘞|好呀|好哦|拜拜|再见|再会|保重|辛苦了|没事|没关系|不用谢|客气了|祝您健康/;

    nodes.forEach(function(node) {
        // 向上查找整条消息文本
        var bubble = node.parentElement;
        var depth = 0;
        var msgText = '';
        while (bubble && depth < 15) {
            msgText = bubble.textContent.trim();
            if (msgText.length > 5) break;
            bubble = bubble.parentElement;
            depth++;
        }

        // 只对短回复（<120字）且包含问候/告别/确认用语去除免责
        if (msgText.length > 120 || !ACK_PATTERN.test(msgText)) return;

        var v = node.nodeValue;
        v = v.replace(/[，,。.\s]*所有内容仅作居家养护参考[，,]不能替代线下医师诊断[、，,][^。！？\n]{0,120}[。.]?/g, '');
        v = v.replace(/[，,。.\s]*所有内容仅作居家养护参考[^。！？\n]{0,120}(?:遵医嘱|遵从线下|咨询主治)[^。！？\n]{0,60}[。.]?/g, '');
        v = v.replace(/[，,。.\s]*所有锻炼需缓慢发力[，,]身体不适立刻停止[，,]康复方案仅供参考[，,]遵从线下骨科医生指导[。.]?/g, '');
        v = v.replace(/[，,。.\s]*康复方案仅供参考[，,]遵从线下骨科医生指导[。.]?/g, '');
        v = v.replace(/[，,。.\s]*不能替代[^。！？\n]{0,80}(?:医生|医嘱|诊断|治疗)[^。！？\n]{0,60}[。.]?/g, '');
        v = v.replace(/[，,。.\s]*任何康复动作[^。！？\n]{0,80}[。.]?/g, '');
        v = v.replace(/[，,。.\s]*请先咨询主治医生[^。！？\n]{0,40}[。.]?/g, '');
        v = v.replace(/[，,。.\s]*遵医嘱开展[。.]?/g, '');
        v = v.replace(/[，,。.\s]*温馨提示[：:][^。！？\n]{0,100}[。.]?/g, '');
        v = v.replace(/[，,。.\s]+$/g, '');
        if (v !== node.nodeValue) {
            node.nodeValue = v;
        }
    });
}

// ===== 启动免责清理监控 =====
function startDisclaimerMonitor() {
    if (monitorObserver) {
        try { monitorObserver.disconnect(); } catch(e) {}
    }
    var chat = document.getElementById('chatContainer');
    if (!chat) return;
    var timer;
    monitorObserver = new MutationObserver(function() {
        clearTimeout(timer);
        timer = setTimeout(function() {
            cleanShortAckDisclaimer();
        }, 600);
    });
    monitorObserver.observe(chat, { childList: true, subtree: true, characterData: true });
    setTimeout(function() { cleanShortAckDisclaimer(); }, 3000);
}

// ===== 打开聊天 =====
function openChat() {
    if (initializing) return;
    initializing = true;

    document.getElementById('homePage').style.display = 'none';
    document.getElementById('closeBtn').style.display = 'block';
    document.getElementById('loadingOverlay').style.display = 'flex';
    document.getElementById('chatContainer').classList.add('chat-open');

    clearChatCache();
    document.getElementById('chatContainer').innerHTML = '';

    var userId = 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

    function loadSDK(cb) {
        if (typeof CozeWebSDK !== 'undefined') { cb(); return; }
        var s = document.createElement('script');
        s.src = 'https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.20/libs/cn/index.js';
        s.onload = cb;
        s.onerror = function() {
            initializing = false;
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('加载失败，请检查网络后刷新');
        };
        document.head.appendChild(s);
    }

    loadSDK(function() {
        createNewConversation().then(function(convId) {
            initChat(userId, convId);
        });
    });
}

// ===== 初始化聊天 =====
function initChat(userId, conversationId) {
    try {
        if (cozeWebSDK) {
            try { cozeWebSDK.destroy(); } catch(e) {}
            cozeWebSDK = null;
        }
        clearChatCache();

        var sdkConfig = {
            bot_id: BOT_ID,
            isIframe: false
        };
        if (conversationId) {
            sdkConfig.conversation_id = conversationId;
        }

        cozeWebSDK = new CozeWebSDK.WebChatClient({
            config: sdkConfig,
            auth: {
                type: 'token',
                token: PAT_TOKEN,
                onRefreshToken: function() { return PAT_TOKEN; }
            },
            userInfo: {
                id: userId,
                url: 'https://lf-coze-web-cdn.coze.cn/obj/coze-web-cn/obric/coze/favicon.1970.png',
                nickname: '用户'
            },
            ui: {
                base: {
                    layout: window.innerWidth >= 768 ? 'pc' : 'mobile',
                    lang: 'zh-CN',
                    zIndex: 99998
                },
                asstBtn: { isNeed: false },
                header: { isShow: true, isNeedClose: false },
                chatBot: {
                    title: '外婆港湾居家养护助手',
                    el: document.getElementById('chatContainer'),
                    isNeedAudio: true,
                    isNeedFunctionCallMessage: true,
                    onShow: function() {
                        document.getElementById('loadingOverlay').style.display = 'none';
                        initializing = false;
                        startDisclaimerMonitor();
                    },
                    onHide: function() {
                        closeChat();
                    }
                },
                footer: { isShow: false }
            }
        });

        cozeWebSDK.showChatBot();

        // 兜底：尝试 SDK 新会话方法
        setTimeout(function() {
            try {
                if (cozeWebSDK) {
                    if (typeof cozeWebSDK.newConversation === 'function') {
                        cozeWebSDK.newConversation();
                    }
                }
            } catch(e) {}
        }, 2000);

        // 最终兜底
        setTimeout(function() {
            document.getElementById('loadingOverlay').style.display = 'none';
            initializing = false;
        }, 6000);

    } catch(e) {
        initializing = false;
        document.getElementById('loadingOverlay').style.display = 'none';
        alert('初始化失败: ' + e.message);
    }
}

// ===== 关闭聊天 =====
function closeChat() {
    if (monitorObserver) { try { monitorObserver.disconnect(); } catch(e) {} monitorObserver = null; }
    if (cozeWebSDK) { try { cozeWebSDK.destroy(); } catch(e) {} cozeWebSDK = null; }
    initializing = false;
    document.getElementById('chatContainer').classList.remove('chat-open');
    document.getElementById('chatContainer').innerHTML = '';
    document.getElementById('closeBtn').style.display = 'none';
    document.getElementById('homePage').style.display = '';
    clearChatCache();
}

document.getElementById('btn').addEventListener('click', openChat);
document.getElementById('closeBtn').addEventListener('click', closeChat);

clearChatCache();
</script>
</body>
</html>
