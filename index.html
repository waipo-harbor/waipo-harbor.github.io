<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>外婆港湾居家养护助手</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "微软雅黑",system-ui,sans-serif;
}
body{
    background: linear-gradient(135deg, #f7f2fc 0%, #efe6f8 100%);
    min-height: 100vh;
    padding-top: 100px;
    text-align: center;
}
.logo{
    width: 70px;
    height: 76px;
    margin: 0 auto 24px;
}
.title{
    font-size: 34px;
    color:#3b2e4c;
    margin-bottom:12px;
    font-weight: 600;
}
.tag{
    display: inline-block;
    padding: 8px 16px;
    background: #ede4f7;
    color: #8855bb;
    border-radius: 20px;
    font-size: 14px;
    margin-bottom: 24px;
}
.desc{
    font-size:20px;
    margin-bottom: 60px;
    line-height: 1.8;
    font-weight: 600;
}
.gradient-text{
    background: linear-gradient(135deg, #9966cc 0%, #824fb8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.slogan-sub{
    font-size: 16px;
    font-weight: 400;
    display: block;
    margin-top: 4px;
}
.open-btn{
    font-size:20px;
    padding:16px 42px;
    background:#9966cc;
    color:#fff;
    border:none;
    border-radius:12px;
    cursor:pointer;
    box-shadow: 0 4px 12px rgba(153, 102, 204, 0.3);
    transition: all 0.25s ease;
}
.open-btn:hover{
    background:#824fb8;
    box-shadow: 0 6px 16px rgba(153, 102, 204, 0.45);
}

/* 聊天容器 */
#chatContainer {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 99998;
    background: #fff;
    justify-content: center;
}
#chatContainer.chat-open {
    display: flex;
}
#chatContainer > div {
    width: 100%;
    max-width: 700px;
    height: 100%;
}

.close-btn {
    display: none;
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(153,102,204,0.9);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    z-index: 1000000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.close-btn:hover { background: #824fb8; }

/* 只隐藏原生视频和音频 */
#chatContainer video,
#chatContainer audio {
    display: none !important;
}

.loading-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.9);
    z-index: 99999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
.loading-overlay .spinner {
    width: 40px; height: 40px;
    border: 4px solid #ede4f7;
    border-top-color: #9966cc;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay .text {
    font-size: 18px;
    color: #9966cc;
}
</style>
</head>
<body>

<button class="close-btn" id="closeBtn">← 返回首页</button>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="text">正在加载聊天界面...</div>
</div>

<div id="chatContainer"></div>

<div id="homePage">
<div class="logo">
<svg viewBox="0 0 100 110" width="70" height="76">
  <path d="M50 6 L92 20 L92 52 C92 80 50 104 50 104 C50 104 8 80 8 52 L8 20 Z" fill="url(#purpleGrad)"/>
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9966cc"/>
      <stop offset="100%" stop-color="#824fb8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdd70"/>
      <stop offset="100%" stop-color="#e6b840"/>
    </linearGradient>
  </defs>
  <path d="M50,38 C42,30 30,34 30,48 C30,62 50,74 50,74 C50,74 70,62 70,48 C70,34 58,30 50,38 Z" fill="url(#goldGrad)"/>
</svg>
</div>
<h1 class="title">外婆港湾居家养护助手</h1>
<div class="tag">亲情陪护 · 康复咨询 · 日常关怀</div>
<p class="desc">
    <span class="gradient-text">以爱为名，以AI为翼</span>
    <span class="gradient-text slogan-sub">五年级小学生为外婆打造的康复礼物</span>
</p>
<button class="open-btn" id="btn">点击开启康复AI助手</button>
</div>

<script>
var cozeWebSDK = null;

// 清缓存
function clearCache() {
    try {
        var keys = Object.keys(localStorage);
        keys.forEach(function(key) {
            if (key.indexOf('coze') !== -1 || key.indexOf('chat') !== -1 || key.indexOf('sdk') !== -1) {
                localStorage.removeItem(key);
            }
        });
        sessionStorage.clear();
        if (window.indexedDB && indexedDB.databases) {
            indexedDB.databases().then(function(dbs) {
                dbs.forEach(function(db) {
                    if (db.name && (db.name.indexOf('coze') !== -1 || db.name.indexOf('chat') !== -1)) {
                        indexedDB.deleteDatabase(db.name);
                    }
                });
            }).catch(function(){});
        }
    } catch(e) {}
}

// 隐藏加载失败的图片（视频白框里的感叹号图标）
function hideBrokenImages() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return;
    var imgs = chat.querySelectorAll('img');
    imgs.forEach(function(img) {
        if (!img.complete || img.naturalWidth === 0) {
            // 图片加载失败，隐藏其父级卡片容器
            var p = img.parentElement;
            if (p) p.style.display = 'none';
            img.style.display = 'none';
        }
    });
}

// 去除免责声明（只改文本，不删元素）
function removeDisclaimer() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return;
    var walker = document.createTreeWalker(chat, NodeFilter.SHOW_TEXT, null, false);
    var node;
    var toChange = [];
    while (node = walker.nextNode()) {
        if (node.nodeValue && node.nodeValue.indexOf('居家养护参考') > -1) {
            toChange.push(node);
        }
    }
    toChange.forEach(function(n) {
        var v = n.nodeValue;
        v = v.replace(/所有内容仅作居家养护参考[，,。.\s\S]*?遵医嘱开展[。.]?/g, '');
        v = v.replace(/所有内容仅作居家养护参考[，,。.\s\S]*?主治医生[，,\s\S]*?遵医嘱开展[。.]?/g, '');
        v = v.replace(/[，,。.\s]+$/, '');
        n.nodeValue = v;
    });
}

// 安全监控：只处理加载失败的图片和免责文本
function startSafeMonitor() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return;

    // 监听图片加载错误
    chat.addEventListener('error', function(e) {
        if (e.target.tagName === 'IMG') {
            var p = e.target.parentElement;
            if (p) p.style.display = 'none';
            e.target.style.display = 'none';
        }
    }, true);

    // DOM变化时检查
    var timer;
    var obs = new MutationObserver(function() {
        clearTimeout(timer);
        timer = setTimeout(function() {
            hideBrokenImages();
            removeDisclaimer();
        }, 500);
    });
    obs.observe(chat, { childList: true, subtree: true, characterData: true });
}

function openChat() {
    document.getElementById('homePage').style.display = 'none';
    document.getElementById('closeBtn').style.display = 'block';
    document.getElementById('loadingOverlay').style.display = 'flex';
    document.getElementById('chatContainer').classList.add('chat-open');

    clearCache();
    document.getElementById('chatContainer').innerHTML = '';

    var userId = 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

    if (typeof CozeWebSDK === 'undefined') {
        var s = document.createElement('script');
        s.src = 'https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.20/libs/cn/index.js';
        s.onload = function() { initChat(userId); };
        s.onerror = function() {
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('加载失败，请检查网络后刷新');
        };
        document.head.appendChild(s);
    } else {
        initChat(userId);
    }
}

function initChat(userId) {
    try {
        if (cozeWebSDK) {
            try { cozeWebSDK.destroy(); } catch(e) {}
            cozeWebSDK = null;
        }
        clearCache();

        cozeWebSDK = new CozeWebSDK.WebChatClient({
            config: {
                bot_id: '7673548882957516835',
                isIframe: false
            },
            auth: {
                type: 'token',
                token: 'pat_ijcyjbaT6lOVV92tApQrNccNVgzVnRdpg1g2bl4RHlAAZnFbNkbwrjEg88qtl5JV',
                onRefreshToken: function() {
                    return 'pat_ijcyjbaT6lOVV92tApQrNccNVgzVnRdpg1g2bl4RHlAAZnFbNkbwrjEg88qtl5JV';
                }
            },
            userInfo: {
                id: userId,
                url: 'https://lf-coze-web-cdn.coze.cn/obj/coze-web-cn/obric/coze/favicon.1970.png',
                nickname: '用户'
            },
            ui: {
                base: {
                    layout: window.innerWidth >= 768 ? 'pc' : 'mobile',
                    lang: 'zh-CN',
                    zIndex: 99998
                },
                asstBtn: { isNeed: false },
                header: { isShow: true, isNeedClose: false },
                chatBot: {
                    title: '外婆港湾居家养护助手',
                    el: document.getElementById('chatContainer'),
                    isNeedAudio: true,
                    isNeedFunctionCallMessage: false,
                    onShow: function() {
                        document.getElementById('loadingOverlay').style.display = 'none';
                        startSafeMonitor();
                    },
                    onHide: function() {
                        closeChat();
                    }
                },
                footer: { isShow: false }
            }
        });

        cozeWebSDK.showChatBot();

        // 新会话
        setTimeout(function() {
            try {
                if (cozeWebSDK && cozeWebSDK.newConversation) cozeWebSDK.newConversation();
            } catch(e) {}
        }, 800);

        // 兜底隐藏加载
        setTimeout(function() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }, 5000);

    } catch(e) {
        document.getElementById('loadingOverlay').style.display = 'none';
        alert('初始化失败: ' + e.message);
    }
}

function closeChat() {
    if (cozeWebSDK) {
        try { cozeWebSDK.destroy(); } catch(e) {}
        cozeWebSDK = null;
    }
    document.getElementById('chatContainer').classList.remove('chat-open');
    document.getElementById('chatContainer').innerHTML = '';
    document.getElementById('closeBtn').style.display = 'none';
    document.getElementById('homePage').style.display = '';
    clearCache();
}

document.getElementById('btn').addEventListener('click', openChat);
document.getElementById('closeBtn').addEventListener('click', closeChat);
clearCache();
</script>
</body>
</html>
