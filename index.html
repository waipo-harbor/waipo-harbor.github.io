<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>外婆港湾居家养护助手</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "微软雅黑",system-ui,sans-serif;
}
body{
    background: linear-gradient(135deg, #f7f2fc 0%, #efe6f8 100%);
    min-height: 100vh;
    padding-top: 100px;
    text-align: center;
}
.logo{
    width: 70px;
    height: 76px;
    margin: 0 auto 24px;
}
.title{
    font-size: 34px;
    color:#3b2e4c;
    margin-bottom:12px;
    font-weight: 600;
}
.tag{
    display: inline-block;
    padding: 8px 16px;
    background: #ede4f7;
    color: #8855bb;
    border-radius: 20px;
    font-size: 14px;
    margin-bottom: 24px;
}
.desc{
    font-size:20px;
    margin-bottom: 60px;
    line-height: 1.8;
    font-weight: 600;
}
.gradient-text{
    background: linear-gradient(135deg, #9966cc 0%, #824fb8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.slogan-sub{
    font-size: 16px;
    font-weight: 400;
    display: block;
    margin-top: 4px;
}
.open-btn{
    font-size:20px;
    padding:16px 42px;
    background:#9966cc;
    color:#fff;
    border:none;
    border-radius:12px;
    cursor:pointer;
    box-shadow: 0 4px 12px rgba(153, 102, 204, 0.3);
    transition: all 0.25s ease;
}
.open-btn:hover{
    background:#824fb8;
    box-shadow: 0 6px 16px rgba(153, 102, 204, 0.45);
}

/* ===== 聊天容器 ===== */
#chatContainer {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 99998;
    background: #fff;
    text-align: left;
    justify-content: center;
}
#chatContainer.chat-open {
    display: flex;
}
#chatContainer > div {
    width: 100%;
    max-width: 700px;
    height: 100%;
}
/* 强制聊天区内所有文字左对齐，覆盖 body 的 text-align:center */
#chatContainer,
#chatContainer div,
#chatContainer p,
#chatContainer span,
#chatContainer li,
#chatContainer td,
#chatContainer th,
#chatContainer label {
    text-align: left !important;
}

.close-btn {
    display: none;
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(153,102,204,0.9);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    z-index: 1000000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.close-btn:hover { background: #824fb8; }

/* 隐藏原生视频/音频 */
#chatContainer video,
#chatContainer audio {
    display: none !important;
}

/* 欢迎消息气泡样式 */
.welcome-msg {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 16px;
    animation: fadeIn 0.3s ease;
}
.welcome-msg .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #9966cc, #824fb8);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    flex-shrink: 0;
}
.welcome-msg .bubble {
    background: #f4f0f9;
    border-radius: 12px;
    padding: 12px 16px;
    max-width: 80%;
    line-height: 1.6;
    color: #333;
    font-size: 15px;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.loading-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.9);
    z-index: 99999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
.loading-overlay .spinner {
    width: 40px; height: 40px;
    border: 4px solid #ede4f7;
    border-top-color: #9966cc;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay .text {
    font-size: 18px;
    color: #9966cc;
}
</style>
</head>
<body>

<button class="close-btn" id="closeBtn">← 返回首页</button>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="text">正在加载聊天界面...</div>
</div>

<div id="chatContainer"></div>

<div id="homePage">
<div class="logo">
<svg viewBox="0 0 100 110" width="70" height="76">
  <path d="M50 6 L92 20 L92 52 C92 80 50 104 50 104 C50 104 8 80 8 52 L8 20 Z" fill="url(#purpleGrad)"/>
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9966cc"/>
      <stop offset="100%" stop-color="#824fb8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdd70"/>
      <stop offset="100%" stop-color="#e6b840"/>
    </linearGradient>
  </defs>
  <path d="M50,38 C42,30 30,34 30,48 C30,62 50,74 50,74 C50,74 70,62 70,48 C70,34 58,30 50,38 Z" fill="url(#goldGrad)"/>
</svg>
</div>
<h1 class="title">外婆港湾居家养护助手</h1>
<div class="tag">亲情陪护 · 康复咨询 · 日常关怀</div>
<p class="desc">
    <span class="gradient-text">以爱为名，以AI为翼</span>
    <span class="gradient-text slogan-sub">五年级小学生为外婆打造的康复礼物</span>
</p>
<button class="open-btn" id="btn">点击开启康复AI助手</button>
</div>

<script>
var cozeWebSDK = null;
var welcomeInjected = false;

// ===== 彻底清缓存 =====
function clearAllCache() {
    try {
        // localStorage - 删除所有 coze/chat/sdk 相关
        var keys = Object.keys(localStorage);
        keys.forEach(function(key) {
            localStorage.removeItem(key);
        });
        // sessionStorage
        try { sessionStorage.clear(); } catch(e) {}
        // cookies
        document.cookie.split(";").forEach(function(c) {
            var eqPos = c.indexOf("=");
            var name = eqPos > -1 ? c.substr(0, eqPos).trim() : c.trim();
            document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
        });
        // IndexedDB
        if (window.indexedDB && indexedDB.databases) {
            indexedDB.databases().then(function(dbs) {
                dbs.forEach(function(db) {
                    if (db.name) indexedDB.deleteDatabase(db.name);
                });
            }).catch(function(){});
        }
        // Service Workers
        if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                registrations.forEach(function(r) { r.unregister(); });
            }).catch(function(){});
        }
    } catch(e) {}
}

// ===== 注入欢迎消息 =====
function injectWelcomeMessage() {
    if (welcomeInjected) return;

    var chat = document.getElementById('chatContainer');
    if (!chat) return;

    // 检查是否已有 bot 消息（SDK 可能已显示欢迎语）
    var existingMsgs = chat.querySelectorAll('[class*="message"], [class*="bubble"], [class*="msg"]');
    if (existingMsgs.length > 0) {
        // SDK 已经有消息了，不需要注入
        return;
    }

    welcomeInjected = true;

    // 找到 SDK 的消息列表容器（通常是 chatContainer 内的某个滚动容器）
    var msgContainer = chat.querySelector('[class*="message-list"], [class*="msg-list"], [class*="chat-list"], [class*="conversation"]');
    if (!msgContainer) {
        // 如果找不到特定容器，直接插入 chatContainer 的第一个子元素之前
        msgContainer = chat;
    }

    var welcomeDiv = document.createElement('div');
    welcomeDiv.className = 'welcome-msg';
    welcomeDiv.innerHTML =
        '<div class="avatar">🏠</div>' +
        '<div class="bubble">您好！我是外婆港湾居家养护助手，很高兴为您服务。请问我该怎么称呼您比较合适呢？叫爷爷还是奶奶呀？</div>';

    // 插入到消息容器顶部
    if (msgContainer === chat) {
        chat.insertBefore(welcomeDiv, chat.firstChild);
    } else {
        msgContainer.insertBefore(welcomeDiv, msgContainer.firstChild);
    }
}

// ===== 隐藏视频白框（SVG感叹号占位框） =====
function hideMediaPlaceholders() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return;

    // 查找所有 SVG 元素
    var svgs = chat.querySelectorAll('svg');
    svgs.forEach(function(svg) {
        // 跳过输入框、按钮区域的 SVG
        if (svg.closest('[class*="input"], [class*="footer"], [class*="compose"], [class*="send"], button, [class*="btn"], [class*="header"], [class*="audio"], [class*="voice"]')) {
            return;
        }

        var el = svg.parentElement;
        // 向上查找最多3层，找到卡片容器
        for (var i = 0; i < 3 && el; i++) {
            if (el === chat) break;

            // 跳过已处理的
            if (el.getAttribute('data-media-hidden') === '1') break;

            var text = el.textContent.trim();
            var hasMinimalText = text.length < 10;
            var isLargeEnough = el.offsetWidth > 120 && el.offsetHeight > 60;

            if (hasMinimalText && isLargeEnough) {
                var style = window.getComputedStyle(el);
                var br = style.borderRadius;
                var hasBorderRadius = br && br !== '0px';

                if (hasBorderRadius) {
                    el.style.setProperty('display', 'none', 'important');
                    el.setAttribute('data-media-hidden', '1');
                    break;
                }
            }
            el = el.parentElement;
        }
    });

    // 同时隐藏加载失败的图片
    var imgs = chat.querySelectorAll('img');
    imgs.forEach(function(img) {
        if (img.getAttribute('data-media-hidden') === '1') return;
        if (!img.complete || img.naturalWidth === 0) {
            var p = img.parentElement;
            if (p && p.offsetWidth > 100) {
                p.style.setProperty('display', 'none', 'important');
                p.setAttribute('data-media-hidden', '1');
            }
            img.style.display = 'none';
        }
    });
}

// ===== 去除免责声明 =====
function removeDisclaimer() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return;

    // 跳过我们注入的欢迎消息
    var walker = document.createTreeWalker(chat, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node) {
            if (node.parentElement && node.parentElement.closest('.welcome-msg')) {
                return NodeFilter.FILTER_REJECT;
            }
            return NodeFilter.FILTER_ACCEPT;
        }
    }, false);

    var node;
    var toChange = [];
    while (node = walker.nextNode()) {
        if (node.nodeValue && (
            node.nodeValue.indexOf('居家养护参考') > -1 ||
            node.nodeValue.indexOf('康复方案仅供参考') > -1 ||
            node.nodeValue.indexOf('不能替代医生') > -1
        )) {
            toChange.push(node);
        }
    }

    toChange.forEach(function(n) {
        var v = n.nodeValue;
        // 匹配各种免责声明变体
        v = v.replace(/所有内容仅作居家养护参考[，,。.\s\S]*?遵医嘱开展[。.]?/g, '');
        v = v.replace(/所有内容仅作居家养护参考[，,。.\s\S]*?遵线下骨科医生指导[。.]?/g, '');
        v = v.replace(/所有锻炼需缓慢发力[，,]身体不适立刻停止[，,]康复方案仅供参考[，,]遵从线下骨科医生指导[。.]?/g, '');
        v = v.replace(/康复方案仅供参考[，,]遵从线下骨科医生指导[。.]?/g, '');
        v = v.replace(/温馨提示[：:]\s*所有锻炼需缓慢发力[，,]身体不适立刻停止[，,]康复方案仅供参考[，,]遵从线下骨科医生指导[。.]?/g, '');
        v = v.replace(/[，,。.\s]+$/, '');
        if (v !== n.nodeValue) {
            n.nodeValue = v;
        }
    });
}

// ===== 安全监控 =====
function startSafeMonitor() {
    var chat = document.getElementById('chatContainer');
    if (!chat) return;

    // 图片加载错误
    chat.addEventListener('error', function(e) {
        if (e.target.tagName === 'IMG') {
            var p = e.target.parentElement;
            if (p && p.offsetWidth > 100) {
                p.style.setProperty('display', 'none', 'important');
            }
            e.target.style.display = 'none';
        }
    }, true);

    // DOM 变化时处理
    var timer;
    var obs = new MutationObserver(function() {
        clearTimeout(timer);
        timer = setTimeout(function() {
            hideMediaPlaceholders();
            removeDisclaimer();
        }, 400);
    });
    obs.observe(chat, { childList: true, subtree: true, characterData: true });
}

// ===== 打开聊天 =====
function openChat() {
    document.getElementById('homePage').style.display = 'none';
    document.getElementById('closeBtn').style.display = 'block';
    document.getElementById('loadingOverlay').style.display = 'flex';
    document.getElementById('chatContainer').classList.add('chat-open');

    welcomeInjected = false;
    clearAllCache();
    document.getElementById('chatContainer').innerHTML = '';

    var userId = 'u_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

    if (typeof CozeWebSDK === 'undefined') {
        var s = document.createElement('script');
        s.src = 'https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.20/libs/cn/index.js';
        s.onload = function() { initChat(userId); };
        s.onerror = function() {
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('加载失败，请检查网络后刷新');
        };
        document.head.appendChild(s);
    } else {
        initChat(userId);
    }
}

// ===== 初始化聊天 =====
function initChat(userId) {
    try {
        if (cozeWebSDK) {
            try { cozeWebSDK.destroy(); } catch(e) {}
            cozeWebSDK = null;
        }
        clearAllCache();

        cozeWebSDK = new CozeWebSDK.WebChatClient({
            config: {
                bot_id: '7673548882957516835',
                isIframe: false
            },
            auth: {
                type: 'token',
                token: 'pat_ijcyjbaT6lOVV92tApQrNccNVgzVnRdpg1g2bl4RHlAAZnFbNkbwrjEg88qtl5JV',
                onRefreshToken: function() {
                    return 'pat_ijcyjbaT6lOVV92tApQrNccNVgzVnRdpg1g2bl4RHlAAZnFbNkbwrjEg88qtl5JV';
                }
            },
            userInfo: {
                id: userId,
                url: 'https://lf-coze-web-cdn.coze.cn/obj/coze-web-cn/obric/coze/favicon.1970.png',
                nickname: '用户'
            },
            ui: {
                base: {
                    layout: window.innerWidth >= 768 ? 'pc' : 'mobile',
                    lang: 'zh-CN',
                    zIndex: 99998
                },
                asstBtn: { isNeed: false },
                header: { isShow: true, isNeedClose: false },
                chatBot: {
                    title: '外婆港湾居家养护助手',
                    el: document.getElementById('chatContainer'),
                    isNeedAudio: true,
                    isNeedFunctionCallMessage: false,
                    onShow: function() {
                        document.getElementById('loadingOverlay').style.display = 'none';
                        startSafeMonitor();

                        // 延迟检查是否需要注入欢迎消息
                        setTimeout(function() {
                            injectWelcomeMessage();
                            hideMediaPlaceholders();
                            removeDisclaimer();
                        }, 1500);
                    },
                    onHide: function() {
                        closeChat();
                    }
                },
                footer: { isShow: false }
            }
        });

        cozeWebSDK.showChatBot();

        // 尝试 SDK 的新会话/清除历史方法
        setTimeout(function() {
            try {
                if (cozeWebSDK) {
                    if (typeof cozeWebSDK.clearChatHistory === 'function') {
                        cozeWebSDK.clearChatHistory();
                    }
                    if (typeof cozeWebSDK.newConversation === 'function') {
                        cozeWebSDK.newConversation();
                    }
                }
            } catch(e) {}
            // 再次检查欢迎消息
            injectWelcomeMessage();
        }, 2000);

        // 兜底隐藏加载
        setTimeout(function() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }, 5000);

    } catch(e) {
        document.getElementById('loadingOverlay').style.display = 'none';
        alert('初始化失败: ' + e.message);
    }
}

// ===== 关闭聊天 =====
function closeChat() {
    if (cozeWebSDK) {
        try { cozeWebSDK.destroy(); } catch(e) {}
        cozeWebSDK = null;
    }
    welcomeInjected = false;
    document.getElementById('chatContainer').classList.remove('chat-open');
    document.getElementById('chatContainer').innerHTML = '';
    document.getElementById('closeBtn').style.display = 'none';
    document.getElementById('homePage').style.display = '';
    clearAllCache();
}

document.getElementById('btn').addEventListener('click', openChat);
document.getElementById('closeBtn').addEventListener('click', closeChat);

// 页面加载时彻底清缓存
clearAllCache();
</script>
</body>
</html>
